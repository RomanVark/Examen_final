name: Verificar compilacion Roman
on:
  push:
    branches:
      - Roman
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4
      - name: Configurar Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Preparar pantalla virtual para JavaFX
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
      - name: Compilar y ejecutar pruebas JUnit y FXML
        run: xvfb-run -a env RUN_FXML_UI_SMOKE=true bash ./mvnw --batch-mode --no-transfer-progress clean test
