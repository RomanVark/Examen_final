name: Verificar compilacion Roman
on:
  push:
    branches:
      - Roman
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4
      - name: Configurar Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas JUnit
        run: bash ./mvnw --batch-mode --no-transfer-progress clean test
