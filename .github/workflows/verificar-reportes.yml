name: JasperReports y pruebas Hibernate

on:
  push:
    branches: [Roman]
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ejecutar pruebas Maven y validar los cuatro PDF
        run: bash ./mvnw -B -ntp clean test
      - name: Publicar PDF de prueba y resultados Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jasperreports-pdf-y-pruebas
          if-no-files-found: warn
          path: |
            target/reportes-verificados/*.pdf
            target/surefire-reports/*.txt
            target/surefire-reports/*.xml
