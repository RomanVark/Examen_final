name: JasperReports y pruebas Hibernate

on:
  push:
    branches: [Roman]
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ejecutar pruebas Maven y validar los cuatro PDF
        run: bash ./mvnw -B -ntp clean test
      - name: Publicar PDF de prueba y resultados Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jasperreports-pdf-y-pruebas
          if-no-files-found: warn
          path: |
            target/reportes-verificados/*.pdf
            target/reportes-compilados/*.jasper
            target/surefire-reports/*.txt
            target/surefire-reports/*.xml

  ddl-postgresql:
    name: Generación DDL nativa en PostgreSQL temporal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: practicas_profesionales_hibernate_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: solo_ci_base_temporal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d practicas_profesionales_hibernate_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Crear y validar 13 tablas por Hibernate create-only
        env:
          HIBERNATE_SCHEMA_DEMO: 'true'
          SCHEMA_DEMO_DB_URL: jdbc:postgresql://localhost:5432/practicas_profesionales_hibernate_demo
          DB_USER: postgres
          DB_PASSWORD: solo_ci_base_temporal
        run: bash ./mvnw -B -ntp "-Dtest=HibernateGeneracionEsquemaTest" test
      - name: Publicar resultado del DDL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacion-ddl-hibernate
          if-no-files-found: warn
          path: |
            target/surefire-reports/*.txt
            target/surefire-reports/*.xml
